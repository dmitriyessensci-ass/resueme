x-base: &base
  restart: unless-stopped
  networks:
    - resume-net

services:
  resume:
    <<: *base
    build: .
    container_name: resume-app

  nginx-proxy:
    <<: *base
    image: nginx:1.31.2
    container_name: resume-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/conf.d/nginx.conf.template:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot:ro
    environment:
      - DOMAIN
    command: >
      /bin/sh -c "envsubst '$${DOMAIN}'
      < /etc/nginx/conf.d/nginx.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - resume

  certbot-renew:
    <<: *base
    image: certbot/certbot:latest
    container_name: resume-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command: |
      -c '
      trap exit TERM;
      while :; do
        certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done;
      '

networks:
  resume-net:
    driver: bridge
